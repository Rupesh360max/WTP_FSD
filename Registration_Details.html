<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Registration Details</legend>

            <table>
                <tr>
                    <td><label>University:</label></td>
                    <td><input type="text" name="txtUniversity" value="" /> </td>
                </tr>

                <tr>
                    <td><label>Institute:</label></td>
                    <td><input type="text" name="txtInstitute" value="" /></td>
                </tr>

                <tr>
                    <td><label>Branch:</label></td>
                    <td>
                        <select name="branch">
                            <option value="">--select--</option>
                            <option value="">CSE</option>
                            <option value="">EE</option>
                            <option value="">CE</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label>Degree:</label></td>
                    <td>
                        <select name="Degree">
                            <option value="">--select--</option>
                            <option value="">B.Tech</option>
                            <option value="">M.Tech</option>
                            <option value="">BA</option>
                        </select>
                    </td>
                    <td><input type="radio" name="A1" value="Pursuing" /><label>Pursuing</label></td>
                    <td><input type="radio" name="A1" value="Completed" /><label>Completed</label></td>
                </tr>

                <tr>
                    <td><label>Average CPI:</label></td>
                    <td><input type="number" name="AvgCPI" value="" />  </td>
                    <td><label>Upto</label></td>
                    <td><input type="number" name="AvgCPI" value="" />  </td>
                    <td><label>Th Semester</label></td>
                </tr>

                <tr>
                    <td><label>Experience:</label></td>
                    <td><input type="number" name="txtExperience" value="" /> </td>
                    <td><label>Years</label></td>
                </tr>

                <tr>
                    <td><label>Your Website Or Blog:</label></td>
                    <td><input type="url" name="webLinlk" value="" placeholder="http://" /> </td>
                </tr>

                <td><button type="submit">Submit</button></td>


            </table>
        </fieldset>
    </form>
</body>
</html>
